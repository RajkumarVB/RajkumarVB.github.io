<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio design previews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:inherit;cursor:pointer}
img{max-width:100%}
/* ---------- switcher bar (not part of the design) ---------- */
#switcher{position:sticky;top:0;z-index:50;background:#111;color:#eee;display:flex;gap:6px;align-items:center;padding:8px 12px;font:13px Inter,sans-serif;overflow-x:auto;white-space:nowrap}
#switcher b{margin-right:6px;color:#aaa;font-weight:500}
#switcher button{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
#switcher button.on{background:#fff;color:#111;border-color:#fff}
#switcher .hint{margin-left:auto;color:#888}
#site{min-height:calc(100vh - 44px)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.narrow{max-width:700px;margin:0 auto;padding:0 20px}
pre{overflow-x:auto;padding:14px;border-radius:8px;font:13px/1.6 'JetBrains Mono',monospace}
.tags span{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin:0 6px 6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.muted{opacity:.7}
nav.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0;flex-wrap:wrap;gap:10px}
nav.top .links a{margin-left:18px;text-decoration:none}
.btn{display:inline-block;padding:9px 16px;border-radius:8px;text-decoration:none;font-weight:500}
section{padding:28px 0}
h1,h2,h3{line-height:1.2}
@media (max-width:700px){nav.top .links a{margin:0 12px 0 0}.side-layout{grid-template-columns:1fr!important}.side-layout aside{position:static!important;height:auto!important}.docs-layout{grid-template-columns:1fr!important}.docs-layout .toc,.docs-layout aside{display:none}}

/* ---------- A. Terminal ---------- */
.t-a{background:#0d1117;color:#c9d1d9;font-family:'JetBrains Mono',monospace;font-size:14px}
.t-a .prompt{color:#3fb950}.t-a .prompt::before{content:"$ "}
.t-a a{color:#58a6ff;text-decoration:none}.t-a a:hover{text-decoration:underline}
.t-a h1{font-size:28px;color:#fff;margin:8px 0}.t-a h2{color:#fff;font-size:18px}.t-a h2::before{content:"## ";color:#8b949e}
.t-a .card{border:1px solid #30363d;border-radius:6px;padding:14px}.t-a .card:hover{border-color:#58a6ff}
.t-a .tags span{background:#161b22;border:1px solid #30363d;color:#8b949e}
.t-a pre{background:#161b22;border:1px solid #30363d}
.t-a .btn{border:1px solid #3fb950;color:#3fb950}
.t-a .cursor{display:inline-block;width:9px;height:18px;background:#3fb950;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- B. Split sidebar ---------- */
.t-b{background:#f8fafc;color:#334155}
.t-b .side-layout{display:grid;grid-template-columns:340px 1fr;gap:48px;max-width:1150px;margin:0 auto;padding:0 24px}
.t-b aside{position:sticky;top:44px;height:calc(100vh - 44px);padding:56px 0;display:flex;flex-direction:column}
.t-b aside h1{font-size:38px;color:#0f172a;margin:0}.t-b aside .role{color:#2563eb;font-weight:500;margin:6px 0 14px}
.t-b aside nav a{display:block;padding:7px 0;text-decoration:none;color:#64748b;font-weight:500;letter-spacing:.04em;font-size:13px;text-transform:uppercase}
.t-b aside nav a.on{color:#0f172a}.t-b aside nav a.on::before{content:"——  ";color:#2563eb}
.t-b main{padding:56px 0}
.t-b h2{color:#0f172a;font-size:15px;text-transform:uppercase;letter-spacing:.08em}
.t-b .card{padding:16px;border-radius:10px;border:1px solid transparent;transition:.15s}.t-b .card:hover{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 18px #0f172a10}
.t-b .card h3{color:#0f172a;margin:4px 0}
.t-b .tags span{background:#dbeafe;color:#1e40af}
.t-b .btn{background:#2563eb;color:#fff}
.t-b pre{background:#0f172a;color:#e2e8f0}

/* ---------- C. Bento ---------- */
.t-c{background:#f4f4f5;color:#27272a}
.t-c .bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.t-c .tile{background:#fff;border-radius:22px;padding:22px;border:1px solid #e4e4e7}
.t-c .tile.accent{background:#18181b;color:#fafafa;border:none}.t-c .tile.mint{background:#d1fae5;color:#065f46;border:none}
.t-c .s2{grid-column:span 2}.t-c .r2{grid-row:span 2}
.t-c .big{font-size:44px;font-weight:700;letter-spacing:-.02em}
.t-c h1{font-size:34px;letter-spacing:-.02em;margin:0 0 8px}
.t-c .card{background:#fff;border-radius:18px;padding:20px;border:1px solid #e4e4e7}.t-c .card:hover{transform:translateY(-2px);transition:.15s}
.t-c .tags span{background:#f4f4f5;color:#3f3f46}
.t-c .btn{background:#18181b;color:#fff;border-radius:999px}
.t-c nav.top .links a{background:#fff;padding:6px 14px;border-radius:999px;margin-left:6px;border:1px solid #e4e4e7}
.t-c pre{background:#18181b;color:#fafafa}
@media (max-width:700px){.t-c .bento{grid-template-columns:1fr 1fr}.t-c .s2{grid-column:span 2}}

/* ---------- D. Editorial ---------- */
.t-d{background:#fffdf8;color:#2b2b2b;font-size:17px;line-height:1.7}
.t-d h1,.t-d h2,.t-d h3,.t-d .serif{font-family:Fraunces,Georgia,serif;font-weight:400;color:#111}
.t-d h1{font-size:44px;line-height:1.15;margin:30px 0 12px}
.t-d nav.top{border-bottom:1px solid #e8e2d4}
.t-d nav.top .links a{text-decoration:none;color:#555}
.t-d .postrow{display:flex;justify-content:space-between;border-top:1px solid #e8e2d4;padding:14px 0;text-decoration:none}
.t-d .postrow:hover .serif{color:#b4532a}
.t-d .tags span{background:#f3ece0;color:#7a4a1e}
.t-d .btn{border:1px solid #111;color:#111;border-radius:0}
.t-d pre{background:#f3ece0;color:#2b2b2b}
.t-d a.inline{color:#b4532a}

/* ---------- E. Brutalist ---------- */
.t-e{background:#fef3c7;color:#000;font-family:'Space Grotesk',sans-serif}
.t-e h1{font-size:56px;line-height:1;margin:20px 0;text-transform:uppercase}
.t-e .card,.t-e .box{background:#fff;border:3px solid #000;box-shadow:6px 6px 0 #000;padding:18px;transition:.1s}
.t-e .card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 #000}
.t-e nav.top{border-bottom:3px solid #000}
.t-e nav.top .links a{text-decoration:none;font-weight:700;border:2px solid #000;padding:4px 10px;background:#fff;margin-left:8px}
.t-e .tags span{background:#a7f3d0;border:2px solid #000;border-radius:0;font-weight:700}
.t-e .btn{background:#f472b6;border:3px solid #000;box-shadow:4px 4px 0 #000;color:#000;border-radius:0;font-weight:700}
.t-e pre{background:#000;color:#a7f3d0;border-radius:0}
.t-e .mark{background:#f472b6;padding:0 6px}

/* ---------- F. Docs ---------- */
.t-f{background:#fff;color:#374151;font-size:15px}
.t-f .docs-layout{display:grid;grid-template-columns:240px 1fr 200px;gap:40px;max-width:1240px;margin:0 auto;padding:0 24px}
.t-f header{border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.t-f header .search{border:1px solid #e5e7eb;border-radius:8px;padding:6px 12px;color:#9ca3af;font-size:13px;width:240px}
.t-f aside{position:sticky;top:44px;height:calc(100vh - 100px);padding:24px 0;font-size:14px;overflow:auto}
.t-f aside .grp{font-size:12px;font-weight:700;text-transform:uppercase;color:#9ca3af;margin:18px 0 6px}
.t-f aside a{display:block;padding:5px 10px;border-radius:6px;text-decoration:none;color:#4b5563}
.t-f aside a.on{background:#ecfdf5;color:#047857;font-weight:500}
.t-f main{padding:28px 0 60px;min-width:0}
.t-f main h1{font-size:32px;color:#111827;margin-top:0}.t-f main h2{color:#111827;border-bottom:1px solid #f3f4f6;padding-bottom:6px}
.t-f .toc{position:sticky;top:44px;padding:28px 0;font-size:13px}.t-f .toc a{display:block;color:#6b7280;padding:3px 0;text-decoration:none}
.t-f .card{border:1px solid #e5e7eb;border-radius:10px;padding:16px}.t-f .card:hover{border-color:#10b981}
.t-f .tags span{background:#f3f4f6;color:#374151;border-radius:6px}
.t-f .btn{background:#10b981;color:#fff}
.t-f pre{background:#1f2937;color:#e5e7eb}
.t-f .crumb{font-size:13px;color:#10b981;font-weight:500}
.t-f .callout{border-left:4px solid #10b981;background:#ecfdf5;padding:10px 14px;border-radius:0 8px 8px 0}

/* ---------- G. Midnight ---------- */
.t-g{background:#0b1020;color:#aab3cf}
.t-g h1{font-size:52px;color:#fff;letter-spacing:-.03em;margin:10px 0}
.t-g h1 em{font-style:normal;background:linear-gradient(90deg,#818cf8,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-g h2,.t-g h3{color:#fff}
.t-g .hero{text-align:center;padding:80px 0 40px}
.t-g .card{background:#121a33;border:1px solid #1f2a4d;border-radius:14px;padding:20px}.t-g .card:hover{border-color:#818cf8}
.t-g .tags span{background:#1e2850;color:#a5b4fc}
.t-g .btn{background:#6366f1;color:#fff;margin:0 4px}.t-g .btn.ghost{background:transparent;border:1px solid #334}
.t-g nav.top .links a{text-decoration:none;color:#aab3cf}
.t-g pre{background:#121a33;color:#e0e7ff;border:1px solid #1f2a4d}
.t-g .pulse{display:inline-block;width:8px;height:8px;background:#22c55e;border-radius:50%;margin-right:6px}

/* ---------- H. Timeline ---------- */
.t-h{background:#fff;color:#3a3a3a}
.t-h h1{font-size:40px;margin:30px 0 6px;color:#111}
.t-h .tl{position:relative;margin-left:12px;border-left:2px solid #e5e5e5;padding-left:26px}
.t-h .tl .item{position:relative;padding-bottom:28px}
.t-h .tl .item::before{content:"";position:absolute;left:-34px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #ea580c}
.t-h .tl .item.post::before{border-color:#0ea5e9}.t-h .tl .item.proj::before{border-color:#16a34a}
.t-h .year{font-size:13px;font-weight:700;color:#999;letter-spacing:.05em}
.t-h .card{border:1px solid #eee;border-radius:10px;padding:16px}
.t-h .tags span{background:#fff7ed;color:#9a3412}
.t-h .btn{background:#ea580c;color:#fff}
.t-h nav.top .links a{text-decoration:none;color:#555}
.t-h pre{background:#1c1917;color:#fafaf9}
.t-h .legend span{font-size:13px;margin-right:14px}.t-h .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<div id="switcher"></div>
<div id="site"></div>
<script>
const ME={name:"Rajkumar V B",role:"Backend Engineer",tag:"I design APIs and distributed systems that stay up, and write about what I learn along the way.",
 resume:"#",github:"https://github.com/RajkumarVB",solved:450};
const PROJECTS=[
 {slug:"payment-reconciliation",title:"Payment Reconciliation Service",co:"Acme Corp",year:"2025",tech:["Java","Spring Boot","PostgreSQL","Kafka"],sum:"Event-driven service that matches 2M transactions a day across three payment providers.",impact:["Cut reconciliation from 6 hours to 15 minutes","p99 latency under 200 ms"]},
 {slug:"event-pipeline",title:"Real-time Event Pipeline",co:"Acme Corp",year:"2024",tech:["Go","Kafka","Redis","AWS"],sum:"Ingests clickstream events and fans them out to analytics and alerting consumers.",impact:["50k events/sec sustained","Zero data loss across 3 region failovers"]},
 {slug:"rate-limiter",title:"Distributed Rate Limiter",co:"Personal project",year:"2023",tech:["Python","Redis","Docker"],sum:"Token-bucket rate limiter library with a Redis Lua backend and benchmarks.",impact:["120 GitHub stars","Used in 2 internal services"]}];
const POSTS=[
 {slug:"sliding-window-explained",title:"Sliding window, explained",date:"Nov 2026",tags:["DSA","LeetCode"],mins:6,sum:"The one pattern that solves a dozen substring problems."},
 {slug:"idempotent-apis",title:"Idempotent APIs in practice",date:"Oct 2026",tags:["Backend","API design"],mins:9,sum:"Why retries break payment systems, and how idempotency keys fix them."},
 {slug:"designing-a-rate-limiter",title:"Designing a rate limiter",date:"Sep 2026",tags:["System design"],mins:11,sum:"Token bucket vs sliding log, with Redis and real numbers."}];
const EXP=[{when:"2023 – Present",what:"Backend Engineer",where:"Acme Corp",desc:"Own the payments platform: reconciliation, ledger APIs, Kafka consumers."},
 {when:"2021 – 2023",what:"Software Engineer",where:"Beta Systems",desc:"Built REST services and internal tooling; migrated monolith modules to Go."}];
const SKILLS={Languages:["Java","Go","Python","SQL"],Backend:["Spring Boot","REST","gRPC","Kafka"],Data:["PostgreSQL","Redis","DynamoDB"],Infra:["AWS","Docker","Kubernetes","GitHub Actions"]};
const TEMPLATES=[["a","A. Terminal"],["b","B. Split sidebar"],["c","C. Bento"],["d","D. Editorial"],["e","E. Brutalist"],["f","F. Docs"],["g","G. Midnight"],["h","H. Timeline"]];
const PAGES=[["home","Home"],["projects","Projects"],["blog","Blog"],["about","About"]];

let S={t:"a",p:"home",s:""};
function readHash(){const h=new URLSearchParams(location.hash.slice(1));S.t=h.get("t")||"a";S.p=h.get("p")||"home";S.s=h.get("s")||""}
function go(o){Object.assign(S,o);location.hash=new URLSearchParams(S).toString()}
const L=(p,s,txt,cls="")=>`<a class="${cls}" data-p="${p}" data-s="${s||""}">${txt}</a>`;
const tags=a=>`<div class="tags">${a.map(x=>`<span>${x}</span>`).join("")}</div>`;
const resumeBtn=(txt="Download resume")=>`<a class="btn" href="${ME.resume}" onclick="alert('Downloads /resume/Rajkumar-Resume.pdf on the real site');return false">${txt}</a>`;

/* ---------- shared page bodies ---------- */
function projCard(p){return `<a class="card" data-p="project" data-s="${p.slug}" style="display:block;text-decoration:none">
 <div class="row"><h3 style="margin:0">${p.title}</h3><span class="muted" style="font-size:13px">${p.year}</span></div>
 <div class="muted" style="font-size:13px;margin:4px 0 8px">${p.co}</div><p style="margin:0 0 10px">${p.sum}</p>${tags(p.tech)}</a>`}
function postItem(p){return `<a class="card" data-p="post" data-s="${p.slug}" style="display:block;text-decoration:none;margin-bottom:12px">
 <div class="row"><h3 style="margin:0">${p.title}</h3><span class="muted" style="font-size:13px;white-space:nowrap">${p.date}</span></div>
 <p style="margin:6px 0 8px" class="muted">${p.sum}</p>${tags(p.tags)}</a>`}
function projectsPage(){return `<h1>Projects</h1><p class="muted">Work projects and personal builds. Click one for the write-up.</p><div class="grid">${PROJECTS.map(projCard).join("")}</div>`}
function blogPage(){return `<h1>Blog</h1><p class="muted">Notes on backend engineering, system design and DSA.</p>${POSTS.map(postItem).join("")}`}
function aboutPage(){return `<h1>About</h1><p>${ME.tag} I care about correctness, observability and boring, reliable systems.</p>${resumeBtn()}
 <h2>Experience</h2>${EXP.map(e=>`<div style="margin-bottom:18px"><div class="row"><strong>${e.what} · ${e.where}</strong><span class="muted" style="font-size:13px">${e.when}</span></div><div class="muted">${e.desc}</div></div>`).join("")}
 <h2>Skills</h2>${Object.entries(SKILLS).map(([k,v])=>`<div style="margin-bottom:8px"><strong style="display:inline-block;width:100px">${k}</strong>${tags(v).replace('class="tags"','class="tags" style="display:inline"')}</div>`).join("")}`}
function projectPage(){const p=PROJECTS.find(x=>x.slug===S.s)||PROJECTS[0];return `${L("projects","","← All projects")}
 <h1>${p.title}</h1><div class="muted">${p.co} · ${p.year}</div><div style="margin:12px 0">${tags(p.tech)}</div>
 <h2>Problem</h2><p>Reconciliation ran as a nightly batch job. Mismatches surfaced a day late and finance teams fixed them by hand.</p>
 <h2>What I built</h2><p>${p.sum} Consumers read provider events from Kafka, normalize them, and match against the internal ledger with idempotent upserts in PostgreSQL.</p>
 <h2>Results</h2><ul>${p.impact.map(i=>`<li>${i}</li>`).join("")}</ul>`}
function postPage(){const p=POSTS.find(x=>x.slug===S.s)||POSTS[0];return `${L("blog","","← All posts")}
 <h1>${p.title}</h1><div class="muted" style="font-size:14px">${p.date} · ${p.mins} min read</div><div style="margin:10px 0">${tags(p.tags)}</div>
 <p>${p.sum} This is placeholder text so you can see how a long-form post reads in this template: paragraph width, heading rhythm and code blocks.</p>
 <h2>The idea</h2><p>Keep two pointers. Grow the window from the right; when it breaks a rule, shrink it from the left. Each element enters and leaves once, so the whole thing is O(n).</p>
 <pre><code>def longest_unique(s: str) -> int:
    seen, left, best = {}, 0, 0
    for right, ch in enumerate(s):
        if seen.get(ch, -1) >= left:
            left = seen[ch] + 1
        seen[ch] = right
        best = max(best, right - left + 1)
    return best</code></pre>
 <h2>When to use it</h2><p>Look for "contiguous subarray or substring" plus "longest", "shortest" or "at most K". That's the signal.</p>
 <div class="muted" style="margin-top:30px;padding-top:14px;border-top:1px solid currentColor;font-size:14px">Comments (Giscus) appear here.</div>`}
function body(){return {projects:projectsPage,blog:blogPage,about:aboutPage,project:projectPage,post:postPage}[S.p]()}
function topnav(brand){return `<nav class="top">${L("home","",brand,"brand")}<div class="links">${PAGES.slice(1).map(([k,v])=>L(k,"",v)).join("")}<a href="${ME.resume}" onclick="return false">Resume</a></div></nav>`}
const navOn=k=>S.p===k||(S.p==="post"&&k==="blog")||(S.p==="project"&&k==="projects");

/* ---------- template renderers ---------- */
const R={
a(){const home=`<section><div class="prompt">whoami</div><h1>${ME.name}</h1><div>${ME.role} — ${ME.tag}</div>
  <div style="margin-top:16px">${resumeBtn("./resume.pdf")} &nbsp; <a href="${ME.github}">github.com/RajkumarVB</a></div></section>
  <section><div class="prompt">ls ~/projects --featured</div><div class="grid" style="margin-top:12px">${PROJECTS.map(projCard).join("")}</div></section>
  <section><div class="prompt">tail -n 3 ~/blog</div><div style="margin-top:12px">${POSTS.map(p=>`<div class="row" style="padding:6px 0"><span>${L("post",p.slug,p.title)}</span><span class="muted">${p.date}</span></div>`).join("")}</div></section>
  <section><div class="prompt">leetcode --stats</div><div>solved: <b style="color:#fff">${ME.solved}</b> &nbsp; easy: 180 &nbsp; medium: 220 &nbsp; hard: 50</div><div style="margin-top:14px"><span class="cursor"></span></div></section>`;
  return `<div class="wrap">${topnav(`<b style="color:#3fb950">~/rajkumar</b>`)}${S.p==="home"?home:`<section>${body()}</section>`}</div>`},
b(){const home=`<section id="about"><h2>About</h2><p>${ME.tag} Currently on the payments platform team at Acme, where I own reconciliation and ledger APIs.</p></section>
  <section><h2>Experience</h2>${EXP.map(e=>`<div class="card" style="display:grid;grid-template-columns:120px 1fr;gap:16px"><div class="muted" style="font-size:13px">${e.when}</div><div><h3>${e.what} · ${e.where}</h3><p style="margin:4px 0" class="muted">${e.desc}</p></div></div>`).join("")}</section>
  <section><h2>Projects</h2>${PROJECTS.map(p=>`<div style="margin-bottom:8px">${projCard(p)}</div>`).join("")}</section>
  <section><h2>Writing</h2>${POSTS.map(postItem).join("")}</section>`;
  return `<div class="side-layout"><aside><h1>${ME.name}</h1><div class="role">${ME.role}</div><p style="max-width:280px">${ME.tag}</p>
  <nav style="margin:28px 0">${PAGES.map(([k,v])=>L(k,"",v,navOn(k)?"on":"")).join("")}</nav>${resumeBtn()}
  <div style="margin-top:auto;font-size:14px"><a href="${ME.github}">GitHub</a> · <a>LinkedIn</a> · <a>Email</a></div></aside>
  <main>${S.p==="home"?home:body()}</main></div>`},
c(){const home=`<div class="bento">
  <div class="tile s2 r2"><div style="width:64px;height:64px;border-radius:50%;background:#d4d4d8;margin-bottom:16px"></div><h1>${ME.name}</h1><p style="font-size:17px">${ME.tag}</p><div style="margin-top:16px">${resumeBtn()}</div></div>
  <div class="tile mint"><div class="big">${ME.solved}+</div>LeetCode problems solved</div>
  <div class="tile accent"><div style="font-size:13px;opacity:.7">Currently</div><div style="font-size:18px;font-weight:500;margin-top:6px">${ME.role} at Acme</div></div>
  <div class="tile"><div class="big">4</div>years building backends</div>
  <div class="tile"><a href="${ME.github}" style="text-decoration:none;font-weight:500">GitHub ↗</a><div class="muted" style="font-size:13px;margin-top:6px">RajkumarVB</div></div>

function render(){readHash();
 document.getElementById("switcher").innerHTML=`<b>Template</b>`+TEMPLATES.map(([k,v])=>`<button class="${S.t===k?"on":""}" data-t="${k}">${v}</button>`).join("")+`<span class="hint">Click around: nav, projects, posts</span>`;
 const site=document.getElementById("site");site.className="t-"+S.t;site.innerHTML=R[S.t]();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-t]");if(t){go({t:t.dataset.t});return}
 const a=e.target.closest("[data-p]");if(a){e.preventDefault();go({p:a.dataset.p,s:a.dataset.s||""})}});
window.addEventListener("hashchange",render);render();
</script>
